<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>레인필드 IM 도구</title>
  <style>
    body { margin:0; display:flex; justify-content:center; align-items:center;
           height:100vh; background:#f5f7fa; font-family:'Malgun Gothic',sans-serif; color:#333; }
    .box { text-align:center; max-width:460px; padding:0 20px; }
    .title { font-size:24px; font-weight:bold; margin-bottom:8px; }
    .tag { font-size:13px; color:#7a869a; margin-bottom:18px; }
    .sub { font-size:14px; color:#888; line-height:1.7; }
    a.btn { display:inline-block; margin-top:18px; background:#08377C; color:#fff;
            text-decoration:none; font-weight:bold; font-size:14px;
            padding:10px 22px; border-radius:6px; }
    .hint { margin-top:22px; padding:14px 18px; text-align:left; background:#fff;
            border:1px solid #DCE6F1; border-radius:8px; font-size:13px;
            line-height:1.8; color:#555; }
    .hint b { color:#08377C; }
    .spin { display:inline-block; width:14px; height:14px; vertical-align:-2px;
            border:2px solid #cdd4e6; border-top-color:#08377C; border-radius:50%;
            animation:r .8s linear infinite; margin-right:6px; }
    @keyframes r { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">레인필드 IM 도구</div>
    <div class="tag">IM 변환기 · IM 요약본</div>
    <div class="sub"><span class="spin"></span>도구로 이동합니다…<br><br>
      이동하지 않으면 <a id="lk" href="#" target="_blank">여기를 클릭</a>
    </div>
    <a class="btn" id="bt" href="#" target="_blank">IM 도구 열기</a>
    <div class="hint">
      <b>들어가면 무엇을 할지 고르는 화면이 나옵니다.</b><br>
      📑 <b>IM 변환기</b> — 원본 IM을 회사 양식 제안서 한 벌로<br>
      📄 <b>IM 요약본</b> — 원본 IM을 4~5장 요약본으로<br><br>
      한동안 아무도 쓰지 않았다면 <b>20~30초</b> 깨어나는 시간이 걸립니다.
    </div>
  </div>
  <script>
    // 배포 주소가 정해지면 WEB 값만 바꾸면 된다.
    const WEB = "https://rainfield-im-tools.streamlit.app";
    const LOCAL = "http://localhost:8600";
    document.getElementById("lk").href = WEB;
    document.getElementById("bt").href = WEB;
    const timeout = ms => new Promise((_, rej) => setTimeout(rej, ms));
    Promise.race([
      fetch(LOCAL + "/_stcore/health", { mode:"no-cors", cache:"no-store" }),
      timeout(1200)
    ]).then(() => location.href = LOCAL).catch(() => location.href = WEB);
  </script>
</body>
</html>
